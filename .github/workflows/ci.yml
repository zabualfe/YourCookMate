name: CI

# Web deploys to Vercel on push to main after tests + build pass.
# API deploys to AWS (SAM) after backend tests pass.
#
# GitHub secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   AWS_ROLE_ARN, AWS_REGION — from aws/bootstrap/github-oidc.yaml (OIDC deploy role)
#   AWS_DATABASE_URL — Supabase pooler URL
#   AWS_JWT_SECRET — same as production JWT_SECRET
#   AWS_FRONTEND_URL — primary Vercel/custom domain for CORS
#   AWS_CORS_ORIGINS — comma-separated (prod + QA origins)
#   AWS_GOOGLE_CLIENT_ID, AWS_GOOGLE_CLIENT_SECRET, AWS_GOOGLE_IOS_CLIENT_ID
#   AWS_APPLE_CLIENT_ID, AWS_APPLE_IOS_CLIENT_ID (optional)
#   AWS_RESEND_API_KEY — Resend API key
#   AWS_YTDLP_COOKIES_B64 — base64 of backend/cookies.social.txt
#   AWS_GEMINI_API_KEY — Google AI Studio key for native video vision
#   AWS_GEMINI_VISION_MODEL — optional (default gemini-3.5-flash)
#   AWS_SOCIAL_VISION_PROVIDER — optional (auto|gemini|frames; default auto)
#
# Vercel project env vars:
#   VITE_API_URL — AWS API Gateway base (auth, recipes, ingest)
#   VITE_AWS_API_URL — optional; defaults to VITE_API_URL when unset

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy-vercel:
    name: Deploy to Vercel (production)
    needs: [backend, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    # Run from repo root — Vercel project Root Directory is already `web`.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

  deploy-aws:
    name: Deploy to AWS (SAM)
    needs: [backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production-api
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: aws
    steps:
      - uses: actions/checkout@v4

      - name: Verify AWS deploy secrets
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [[ -z "${{ secrets.AWS_ROLE_ARN }}" || -z "${{ secrets.AWS_REGION }}" ]]; then
            echo "::error::AWS_ROLE_ARN and AWS_REGION secrets are required. See aws/README.md"
            exit 1
          fi
          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]+:role/ ]]; then
            echo "::error::AWS_ROLE_ARN must look like arn:aws:iam::123456789012:role/yourcookmate-github-deploy-zabualfe"
            exit 1
          fi
          echo "Using IAM role: ${AWS_ROLE_ARN##*/}"
          echo "Role account: $(echo "$AWS_ROLE_ARN" | cut -d: -f5)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - uses: aws-actions/setup-sam@v2

      - name: SAM validate
        run: sam validate --lint

      - name: SAM build
        run: sam build --use-container

      - name: SAM deploy
        env:
          DATABASE_URL: ${{ secrets.AWS_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.AWS_JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.AWS_FRONTEND_URL }}
          CORS_ORIGINS: ${{ secrets.AWS_CORS_ORIGINS }}
          YTDLP_COOKIES_B64: ${{ secrets.AWS_YTDLP_COOKIES_B64 }}
          RESEND_API_KEY: ${{ secrets.AWS_RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.AWS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.AWS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.AWS_GOOGLE_IOS_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ secrets.AWS_APPLE_CLIENT_ID }}
          APPLE_IOS_CLIENT_ID: ${{ secrets.AWS_APPLE_IOS_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.AWS_API_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.AWS_GEMINI_API_KEY }}
          GEMINI_VISION_MODEL: ${{ secrets.AWS_GEMINI_VISION_MODEL }}
          SOCIAL_VISION_PROVIDER: ${{ secrets.AWS_SOCIAL_VISION_PROVIDER }}
        run: |
          overrides=( "Stage=prod" )
          if [[ -n "${FRONTEND_URL:-}" ]]; then
            overrides+=( "FrontendUrl=${FRONTEND_URL}" )
          else
            overrides+=( "FrontendUrl=*" )
          fi
          if [[ -n "${CORS_ORIGINS:-}" ]]; then
            overrides+=( "CorsOrigins=${CORS_ORIGINS}" )
          elif [[ -n "${FRONTEND_URL:-}" ]]; then
            overrides+=( "CorsOrigins=${FRONTEND_URL}" )
          else
            overrides+=( "CorsOrigins=*" )
          fi
          if [[ -n "${DATABASE_URL:-}" ]]; then
            overrides+=( "DatabaseUrl=${DATABASE_URL}" )
          fi
          if [[ -n "${JWT_SECRET:-}" ]]; then
            overrides+=( "JwtSecret=${JWT_SECRET}" )
          fi
          if [[ -n "${YTDLP_COOKIES_B64:-}" ]]; then
            overrides+=( "YtdlpCookiesB64=${YTDLP_COOKIES_B64}" )
          fi
          if [[ -n "${RESEND_API_KEY:-}" ]]; then
            overrides+=( "ResendApiKey=${RESEND_API_KEY}" )
          fi
          if [[ -n "${GOOGLE_CLIENT_ID:-}" ]]; then
            overrides+=( "GoogleClientId=${GOOGLE_CLIENT_ID}" )
          fi
          if [[ -n "${GOOGLE_CLIENT_SECRET:-}" ]]; then
            overrides+=( "GoogleClientSecret=${GOOGLE_CLIENT_SECRET}" )
          fi
          if [[ -n "${GOOGLE_IOS_CLIENT_ID:-}" ]]; then
            overrides+=( "GoogleIosClientId=${GOOGLE_IOS_CLIENT_ID}" )
          fi
          if [[ -n "${APPLE_CLIENT_ID:-}" ]]; then
            overrides+=( "AppleClientId=${APPLE_CLIENT_ID}" )
          fi
          if [[ -n "${APPLE_IOS_CLIENT_ID:-}" ]]; then
            overrides+=( "AppleIosClientId=${APPLE_IOS_CLIENT_ID}" )
          fi
          if [[ -n "${API_BASE_URL:-}" ]]; then
            overrides+=( "ApiBaseUrl=${API_BASE_URL}" )
          fi
          if [[ -n "${GEMINI_API_KEY:-}" ]]; then
            overrides+=( "GeminiApiKey=${GEMINI_API_KEY}" )
          fi
          if [[ -n "${GEMINI_VISION_MODEL:-}" ]]; then
            overrides+=( "GeminiVisionModel=${GEMINI_VISION_MODEL}" )
          else
            overrides+=( "GeminiVisionModel=gemini-3.5-flash" )
          fi
          if [[ -n "${SOCIAL_VISION_PROVIDER:-}" ]]; then
            overrides+=( "SocialVisionProvider=${SOCIAL_VISION_PROVIDER}" )
          else
            overrides+=( "SocialVisionProvider=auto" )
          fi
          echo "Deploying AWS stack (Stage, ApiFunction, ingest workers…)"
          sam deploy --no-fail-on-empty-changeset --parameter-overrides "${overrides[@]}"

      - name: Empty SAM source bucket
        if: success()
        run: |
          chmod +x scripts/cleanup-sam-source-bucket.sh
          ./scripts/cleanup-sam-source-bucket.sh

      - name: Print CloudFormation errors on failure
        if: failure()
        run: |
          for stack in yourcookmate aws-sam-cli-managed-default; do
            echo "=== $stack ==="
            aws cloudformation describe-stack-events --stack-name "$stack" \
              --max-items 15 --query 'StackEvents[*].[Timestamp,ResourceStatus,ResourceType,ResourceStatusReason]' \
              --output table 2>/dev/null || true
          done
