name: CI

# Web deploys to Vercel on push to main after tests + build pass.
# API deploys to Render via deploy hook after backend tests pass.
#
# GitHub secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   RENDER_DEPLOY_HOOK_URL — Render → yourcookmate-api → Settings → Deploy Hook
#   AWS_ROLE_ARN, AWS_REGION — from aws/bootstrap/github-oidc.yaml (OIDC deploy role)
#   AWS_DATABASE_URL — Supabase pooler URL for ingest worker Lambdas (optional for stub deploy)
#   AWS_FRONTEND_URL — Vercel production URL for API Gateway CORS (optional; default *)
#
# Vercel project (Root Directory = web) env vars:
#   VITE_API_URL — production API URL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy-vercel:
    name: Deploy to Vercel (production)
    needs: [backend, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    # Run from repo root — Vercel project Root Directory is already `web`.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

  deploy-render:
    name: Deploy to Render (production)
    needs: [backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: https://yourcookmate-api.onrender.com
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$DEPLOY_HOOK" ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing"
            exit 1
          fi
          # Hook URLs already include ?key=… — use &ref=, not a second ?
          if [[ "$DEPLOY_HOOK" == *"?"* ]]; then
            url="${DEPLOY_HOOK}&ref=${{ github.sha }}"
          else
            url="${DEPLOY_HOOK}?ref=${{ github.sha }}"
          fi
          curl -fsS "$url"
          echo "Triggered Render deploy for ${{ github.sha }}"

  deploy-aws:
    name: Deploy to AWS (SAM)
    needs: [backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # No GitHub environment here — environment secrets override repo secrets and
    # often cause a stale/wrong AWS_ROLE_ARN. OIDC sub will be ref:refs/heads/main.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: aws
    steps:
      - uses: actions/checkout@v4

      - name: Verify AWS deploy secrets
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [[ -z "${{ secrets.AWS_ROLE_ARN }}" || -z "${{ secrets.AWS_REGION }}" ]]; then
            echo "::error::AWS_ROLE_ARN and AWS_REGION secrets are required. See aws/README.md"
            exit 1
          fi
          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]+:role/ ]]; then
            echo "::error::AWS_ROLE_ARN must look like arn:aws:iam::123456789012:role/yourcookmate-github-deploy-zabualfe"
            exit 1
          fi
          echo "Using IAM role: ${AWS_ROLE_ARN##*/}"
          echo "Role account: $(echo "$AWS_ROLE_ARN" | cut -d: -f5)"

      - name: Debug GitHub OIDC token (sub claim)
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          payload_b64=$(echo "$token" | cut -d. -f2)
          padding=$((4 - ${#payload_b64} % 4))
          [[ "$padding" -ne 4 ]] && payload_b64="${payload_b64}$(printf '=%.0s' $(seq 1 $padding))"
          echo "OIDC token claims:"
          echo "$payload_b64" | tr '_-' '/+' | base64 -d 2>/dev/null | jq . || echo "(could not decode)"

      - name: Test STS assume role (shows AWS error detail)
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          pip install awscli -q
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "Calling sts:AssumeRoleWithWebIdentity on $AWS_ROLE_ARN ..."
          aws sts assume-role-with-web-identity \
            --role-arn "$AWS_ROLE_ARN" \
            --role-session-name "github-debug-${GITHUB_RUN_ID}" \
            --web-identity-token "$token" \
            --duration-seconds 900 \
            --output json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - uses: aws-actions/setup-sam@v2

      - name: SAM validate
        run: sam validate --lint

      - name: SAM build
        run: sam build

      - name: SAM deploy
        env:
          DATABASE_URL: ${{ secrets.AWS_DATABASE_URL }}
          FRONTEND_URL: ${{ secrets.AWS_FRONTEND_URL }}
        run: |
          overrides=( "Stage=prod" )
          if [[ -n "${FRONTEND_URL:-}" ]]; then
            overrides+=( "FrontendUrl=${FRONTEND_URL}" )
          else
            overrides+=( "FrontendUrl=*" )
          fi
          if [[ -n "${DATABASE_URL:-}" ]]; then
            overrides+=( "DatabaseUrl=${DATABASE_URL}" )
          fi
          echo "Deploying with parameters: Stage, FrontendUrl${DATABASE_URL:+, DatabaseUrl}"
          sam deploy --no-fail-on-empty-changeset --parameter-overrides "${overrides[@]}"

      - name: Print CloudFormation errors on failure
        if: failure()
        run: |
          for stack in yourcookmate aws-sam-cli-managed-default; do
            echo "=== $stack ==="
            aws cloudformation describe-stack-events --stack-name "$stack" \
              --max-items 15 --query 'StackEvents[*].[Timestamp,ResourceStatus,ResourceType,ResourceStatusReason]' \
              --output table 2>/dev/null || true
          done
