AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: YourCookMate AWS — async ingest on Lambda (yt-dlp, Bedrock Nova, Transcribe).

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z0-9-]+$"
  DatabaseUrl:
    Type: String
    NoEcho: true
    Default: ""
  YtdlpCookiesB64:
    Type: String
    NoEcho: true
    Default: ""
    Description: Base64-encoded Netscape cookie file (Instagram/Facebook). Use encode-cookies.sh.
  BedrockVisionModel:
    Type: String
    Default: amazon.nova-lite-v1:0
  BedrockParseModel:
    Type: String
    Default: amazon.nova-lite-v1:0
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Google AI Studio API key for native Gemini video ingest.
  GeminiVisionModel:
    Type: String
    Default: gemini-3.5-flash
  SocialVisionProvider:
    Type: String
    Default: auto
    AllowedValues: [auto, gemini, frames]
    Description: auto prefers Gemini when GEMINI_API_KEY is set, else Bedrock frames.
  FrontendUrl:
    Type: String
    Default: "*"
  ResendApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Resend API key for verification emails (HTTPS from Lambda).
  EmailApiSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Shared secret — Render backend sends Authorization Bearer on POST /email/send.
  SmtpFrom:
    Type: String
    Default: noreply@yourcookmate.com
  JwtSecret:
    Type: String
    NoEcho: true
    Default: ""
  CorsOrigins:
    Type: String
    Default: "https://yourcookmate.com,https://www.yourcookmate.com,https://your-cook-mate.vercel.app,http://localhost:5173"
    Description: Comma-separated origins for API Gateway CORS and FastAPI (no spaces).
  GoogleClientId:
    Type: String
    Default: ""
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""
  GoogleIosClientId:
    Type: String
    Default: ""
  AppleClientId:
    Type: String
    Default: ""
  AppleIosClientId:
    Type: String
    Default: ""
  AdminEmails:
    Type: String
    Default: ""
  ApiBaseUrl:
    Type: String
    Default: ""
    Description: Public API URL for OAuth callbacks (optional — derived from request Host when empty).
  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Live Stripe secret or restricted key (sk_live_… / rk_live_…).
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Live webhook signing secret (whsec_…).
  StripePriceId:
    Type: String
    Default: ""
    Description: Live Stripe Price ID for Pro (price_…).
  StripeProPriceLabel:
    Type: String
    Default: ""
    Description: Optional display label, e.g. $7.99/month.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64
    CodeUri: src/

Resources:
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3600

  UploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadUploads
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${UploadsBucket.Arn}/*"

  IngestTempBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTranscribeTemp
            Status: Enabled
            Prefix: transcribe/
            ExpirationInDays: 1

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins: !Split
          - ","
          - !Ref CorsOrigins

  IngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestDLQ.Arn
        maxReceiveCount: 3

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Description: FastAPI auth, recipes, collections, admin (Mangum).
      Handler: lambda_handler.handler
      Timeout: 30
      MemorySize: 1024
      CodeUri: ../backend/
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET: !Ref JwtSecret
          API_BASE_URL: !Ref ApiBaseUrl
          FRONTEND_URL: !Ref FrontendUrl
          CORS_ORIGINS: !Ref CorsOrigins
          RESEND_API_KEY: !Ref ResendApiKey
          SMTP_FROM: !Ref SmtpFrom
          UPLOADS_BUCKET: !Ref UploadsBucket
          UPLOADS_PUBLIC_BASE_URL: !Sub "https://${UploadsBucket}.s3.${AWS::Region}.amazonaws.com"
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_IOS_CLIENT_ID: !Ref GoogleIosClientId
          APPLE_CLIENT_ID: !Ref AppleClientId
          APPLE_IOS_CLIENT_ID: !Ref AppleIosClientId
          ADMIN_EMAILS: !Ref AdminEmails
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          STRIPE_PRICE_ID: !Ref StripePriceId
          STRIPE_PRO_PRICE_LABEL: !Ref StripeProPriceLabel
          FEATURE_AUTH: "true"
          FEATURE_REGISTRATION: "true"
          FEATURE_AI: "true"
          FEATURE_SOCIAL_INGEST: "true"
          FEATURE_COMMUNITY: "true"
          FEATURE_INSTACART: "false"
          INSTACART_ENABLED: "false"
          STAGE: !Ref Stage
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UploadsBucket
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  EnqueueIngestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      Handler: enqueue_ingest.app.handler
      Environment:
        Variables:
          INGEST_QUEUE_URL: !Ref IngestQueue
          DATABASE_URL: !Ref DatabaseUrl
          STAGE: !Ref Stage
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt IngestQueue.QueueName
      Events:
        IngestLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ingest/link
            Method: POST

  GetJobFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      Handler: get_job.app.handler
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          STAGE: !Ref Stage
      Events:
        GetJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs/{job_id}
            Method: GET

  ParseRecipeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      Description: Recipe parse — Bedrock Nova breaks text into steps.
      Handler: parse_recipe.app.handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          BEDROCK_PARSE_MODEL: !Ref BedrockParseModel
          FEATURE_AI_ENABLED: "true"
          STAGE: !Ref Stage
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: "*"
      Events:
        ParseRecipe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /recipes/parse
            Method: POST

  PreviewLinkFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Description: Fast link preview — title, author, thumbnail via yt-dlp metadata.
      Handler: preview_link.app.handler
      Timeout: 45
      MemorySize: 512
      Environment:
        Variables:
          YTDLP_COOKIES_B64: !Ref YtdlpCookiesB64
          STAGE: !Ref Stage
      Events:
        PreviewLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ingest/preview
            Method: POST

  SendEmailFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      Description: Internal email send via Resend (optional — ApiFunction also sends directly).
      Handler: send_email.app.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          RESEND_API_KEY: !Ref ResendApiKey
          EMAIL_API_SECRET: !Ref EmailApiSecret
          SMTP_FROM: !Ref SmtpFrom
          STAGE: !Ref Stage
      Events:
        SendEmail:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /email/send
            Method: POST

  IngestWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Description: Native ingest — yt-dlp, Gemini / Bedrock vision, Amazon Transcribe.
      Handler: ingest_worker.app.handler
      Timeout: 900
      MemorySize: 2048
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          YTDLP_COOKIES_B64: !Ref YtdlpCookiesB64
          INGEST_TEMP_BUCKET: !Ref IngestTempBucket
          BEDROCK_VISION_MODEL: !Ref BedrockVisionModel
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_VISION_MODEL: !Ref GeminiVisionModel
          SOCIAL_VISION_PROVIDER: !Ref SocialVisionProvider
          FEATURE_AI_ENABLED: "true"
          STAGE: !Ref Stage
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt IngestQueue.QueueName
        - S3CrudPolicy:
            BucketName: !Ref IngestTempBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: "*"
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
                - transcribe:DeleteTranscriptionJob
              Resource: "*"
      Events:
        IngestQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  ApiEndpoint:
    Description: Set VITE_API_URL and VITE_AWS_API_URL on Vercel to this URL (single API).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UploadsBucketName:
    Description: Public S3 bucket for recipe icons and media
    Value: !Ref UploadsBucket
  IngestTempBucketName:
    Description: S3 bucket for transient transcribe audio
    Value: !Ref IngestTempBucket
