AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: YourCookMate AWS — async ingest on Lambda (yt-dlp, Bedrock Nova, Transcribe).

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z0-9-]+$"
  DatabaseUrl:
    Type: String
    NoEcho: true
    Default: ""
  YtdlpCookies:
    Type: String
    NoEcho: true
    Default: ""
    Description: Netscape-format cookies for Instagram/Facebook (same as Render YTDLP_COOKIES).
  BedrockVisionModel:
    Type: String
    Default: amazon.nova-lite-v1:0
  FrontendUrl:
    Type: String
    Default: "*"

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64
    CodeUri: src/

Resources:
  IngestTempBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTranscribeTemp
            Status: Enabled
            Prefix: transcribe/
            ExpirationInDays: 1

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins:
          - !Ref FrontendUrl

  IngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestDLQ.Arn
        maxReceiveCount: 3

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: health.app.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  EnqueueIngestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      Handler: enqueue_ingest.app.handler
      Environment:
        Variables:
          INGEST_QUEUE_URL: !Ref IngestQueue
          DATABASE_URL: !Ref DatabaseUrl
          STAGE: !Ref Stage
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt IngestQueue.QueueName
      Events:
        IngestLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ingest/link
            Method: POST

  GetJobFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      Handler: get_job.app.handler
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          STAGE: !Ref Stage
      Events:
        GetJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs/{job_id}
            Method: GET

  IngestWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
      RequirementsFile: requirements-worker.txt
    Properties:
      Description: Native ingest — yt-dlp, Bedrock Nova vision, Amazon Transcribe.
      Handler: ingest_worker.app.handler
      Timeout: 900
      MemorySize: 2048
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          YTDLP_COOKIES: !Ref YtdlpCookies
          INGEST_TEMP_BUCKET: !Ref IngestTempBucket
          BEDROCK_VISION_MODEL: !Ref BedrockVisionModel
          FEATURE_AI_ENABLED: "true"
          STAGE: !Ref Stage
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt IngestQueue.QueueName
        - S3CrudPolicy:
            BucketName: !Ref IngestTempBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: "*"
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
                - transcribe:DeleteTranscriptionJob
              Resource: "*"
      Events:
        IngestQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  ApiEndpoint:
    Description: Set VITE_AWS_API_URL / AWS_API_URL on Vercel
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  IngestTempBucketName:
    Description: S3 bucket for transient transcribe audio
    Value: !Ref IngestTempBucket
