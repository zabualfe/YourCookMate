AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: YourCookMate AWS stack — async ingest via API Gateway, SQS, Lambda, Supabase jobs.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z0-9-]+$"
  DatabaseUrl:
    Type: String
    NoEcho: true
    Default: ""
    Description: Supabase Postgres URL (session pooler, port 5432).
  IngestApiUrl:
    Type: String
    Default: ""
    Description: Render API base URL for ingest worker (e.g. https://yourcookmate-api.onrender.com).
  BedrockParseModel:
    Type: String
    Default: amazon.nova-lite-v1:0
  FrontendUrl:
    Type: String
    Default: "*"
    Description: CORS allow origin (Vercel production URL).

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64
    CodeUri: src/

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins:
          - !Ref FrontendUrl

  IngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestDLQ.Arn
        maxReceiveCount: 3

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Health check for the AWS API surface.
      Handler: health.app.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  EnqueueIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Queue social ingest jobs (Supabase jobs + SQS).
      Handler: enqueue_ingest.app.handler
      Environment:
        Variables:
          INGEST_QUEUE_URL: !Ref IngestQueue
          DATABASE_URL: !Ref DatabaseUrl
          STAGE: !Ref Stage
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt IngestQueue.QueueName
      Events:
        IngestLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ingest/link
            Method: POST

  GetJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Poll async ingest job status from Supabase.
      Handler: get_job.app.handler
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          STAGE: !Ref Stage
      Events:
        GetJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs/{job_id}
            Method: GET

  IngestWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Run ingest via Render API; store result in Supabase jobs table.
      Handler: ingest_worker.app.handler
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          INGEST_API_URL: !Ref IngestApiUrl
          INGEST_TIMEOUT_SECONDS: "600"
          STAGE: !Ref Stage
          BEDROCK_PARSE_MODEL: !Ref BedrockParseModel
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt IngestQueue.QueueName
      Events:
        IngestQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  ApiEndpoint:
    Description: Set VITE_AWS_API_URL / EXPO_PUBLIC_AWS_API_URL to this value + stage path
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  IngestQueueUrl:
    Description: SQS ingest queue URL
    Value: !Ref IngestQueue
  IngestQueueArn:
    Description: SQS ingest queue ARN
    Value: !GetAtt IngestQueue.Arn
  IngestDLQUrl:
    Description: SQS dead-letter queue URL
    Value: !Ref IngestDLQ
